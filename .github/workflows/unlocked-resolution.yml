name: Unlocked Resolution

# Resolves the dependency *ranges* in pyproject.toml with no lockfile, against
# live PyPI, and smoke-tests the result (#1169).
#
# Everything else in CI resolves uv.lock. A user running `uv tool install
# codeframe-ai` gets none of it — pip/uv resolve the ranges from scratch, today,
# against whatever is on PyPI today. The two resolutions drift apart silently and
# continuously, and twice that drift shipped a dead-on-arrival release while
# every gate was green:
#
#   0.9.1  retired Anthropic model IDs      -> every AI command 404'd    (#1112)
#   0.9.2  anthropic>=0.18.0 -> 1.0.0, which
#          removed `temperature`            -> every AI command TypeError'd (#1168)
#
# The schedule is the point: this break arrives from upstream, not from a commit
# of ours, so it can appear on a day nobody pushed anything.
#
# A red scheduled run opens or updates an issue (#1239, #1242) via the shared
# scheduled-failure-issue.yml job below — the Actions tab alone is not a signal
# anyone reads on a day nobody pushed.

on:
  schedule:
    # Daily, 06:00 UTC — a few hours before a working day starts, so a break
    # that landed on PyPI overnight is known before anyone tags a release.
    - cron: "0 6 * * *"
  workflow_dispatch:
  workflow_call: # release.yml gates on this
  pull_request:
    paths:
      - "pyproject.toml"
      - "tests/adapters/test_sdk_kwargs_guard_614.py"
      - "tests/adapters/test_model_defaults_guard_1112.py"
      # Everything the job now runs (#1268), so a PR that breaks one under the
      # unlocked resolution is red on the PR, not on the next morning's run.
      - "tests/adapters/test_request_shape_1267.py"
      - "tests/cli/**"
      - "tests/core/test_tui_dashboard.py"
      - "tests/core/test_cli_validators.py"
      - "tests/lifecycle/test_api_lifecycle.py"
      - "codeframe/cli/**"
      - "codeframe/adapters/llm/**"
      - "pytest.ini" # its filterwarnings decide whether these guards pass (#1340)
      - ".github/workflows/unlocked-resolution.yml"

permissions:
  contents: read

jobs:
  unlocked-install:
    name: Fresh resolve + smoke test
    runs-on: ubuntu-latest
    # A few minutes in practice. The cap is for the unattended schedule: a stalled
    # PyPI resolution would otherwise sit on a runner until the 6h default.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        # No enable-cache on purpose: a cached resolution is the locked
        # resolution wearing a different hat, and defeats the whole job.
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.11"

      - name: Resolve the ranges, not the lock
        # `uv pip install` is the pip-compatible interface: it ignores uv.lock
        # and resolves pyproject.toml from scratch. `uv sync`/`uv run` would not.
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/unlocked"
          uv pip install --python "$RUNNER_TEMP/unlocked" .
          {
            echo "### Resolved from pyproject.toml ranges (no lockfile)"
            echo '```'
            uv pip list --python "$RUNNER_TEMP/unlocked"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: cf --help imports the whole package
        run: |
          "$RUNNER_TEMP/unlocked/bin/cf" --help

      - name: Test harness plugin
        # pytest itself is a runtime dependency; pytest-timeout is a dev one the
        # lifecycle test's timeout marker needs under --strict-markers. Installed
        # after the summary above, so the listed resolution is the product's.
        run: uv pip install --python "$RUNNER_TEMP/unlocked" pytest-timeout

      - name: CLI, TUI, validators, mock API lifecycle and SDK wire guards against the resolved env
        # Installing cleanly is not evidence: 0.9.2 installed fine and raised on
        # the first API call, and a fresh typer 0.27 broke `cf proof capture`,
        # --help and telemetry while `cf --help` still ran (#1268). So this runs
        # the CLI suite, the TUI and validators, the Golden Path over HTTP on the
        # mock provider, and the SDK guards (signature, model defaults, and the
        # wire-level request shape for both providers).
        #
        # The interpreter is invoked by absolute path, never by activating the
        # venv: an activated venv can fall back to a different interpreter on
        # PATH and quietly test the wrong environment. The code under test is
        # the checkout; what this checks is the dependency resolution under it.
        run: |
          "$RUNNER_TEMP/unlocked/bin/python" -m pytest -p no:cacheprovider -q \
            tests/cli \
            tests/core/test_tui_dashboard.py \
            tests/core/test_cli_validators.py \
            tests/lifecycle/test_api_lifecycle.py \
            tests/adapters/test_sdk_kwargs_guard_614.py \
            tests/adapters/test_model_defaults_guard_1112.py \
            tests/adapters/test_request_shape_1267.py

  # Same signal test.yml and web-ui-audit.yml use (#1239): a red scheduled run
  # has no PR to be red on, so open or update the one issue for this workflow.
  # `failure()` only, as in the other two callers: a cancelled run is usually a
  # deliberate cancel, and the next morning's run reports on its own.
  report-scheduled-failure:
    name: Report scheduled failure
    needs: [unlocked-install]
    if: failure() && github.event_name == 'schedule'
    uses: ./.github/workflows/scheduled-failure-issue.yml
    permissions:
      issues: write

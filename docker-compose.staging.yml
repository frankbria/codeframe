# Staging overrides (#1121). Ports match what nginx already proxies on the box:
# /api /auth /ws /health → 14200, / → 14100.
services:
  backend:
    image: ghcr.io/frankbria/codeframe-backend:${IMAGE_TAG:-staging}
    ports:
      # From the environment so this and the deploy's health check read the
      # same API_PORT and cannot drift apart (review finding on #1121).
      - "127.0.0.1:${BACKEND_PORT:-14200}:14200"
  frontend:
    image: ghcr.io/frankbria/codeframe-frontend:${IMAGE_TAG:-staging}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-14100}:14100"
